    <!-- Virtual Dom -->
    <script>
        function onClick(){
            const addList = document.getElementById("addList");
            let list = "";
            for (let i = 0; i <= 3000; i++) {
                list += `<li>${i}</li>`;
            }
            addList.innerHTML = list;
        }
    </script>
</head>
<body>
    <button onclick="onClick()">리스트 추가하기</button>
    <ul id="addList"></ul>
</body>
